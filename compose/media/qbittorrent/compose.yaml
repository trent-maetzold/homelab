# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  app:
    container_name: qbittorrent
    image: ghcr.io/hotio/qbittorrent:release
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - /mnt/cache/appdata/qbittorrent/app/config:/config
      - /mnt/user/data/torrents:/data/torrents
    networks:
      proxy:
      pvr:
        aliases:
          - qbittorrent_vpn
    environment:
      TZ: "America/Chicago"
      PUID: "99"
      PGID: "100"
      WEBUI_PORTS: "8080/tcp"
      VPN_ENABLED: "true"
      VPN_CONF: "wg0"
      VPN_PROVIDER: "proton"
      VPN_LAN_LEAK_ENABLED: "false"
      VPN_AUTO_PORT_FORWARD: "true"
      UMASK: "022"
    labels:
      traefik.enable: "true"
      traefik.http.routers.qbittorrent.rule: "Host(`bt.trkm.io`)"
      traefik.http.services.qbittorrent.loadBalancer.server.port: "8080"

networks:
  pvr:
    external: true
  proxy:
    external: true
