# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  gateway:
    container_name: openclaw
    build: .
    restart: unless-stopped
    volumes:
      - /mnt/cache/appdata/openclaw/gateway/home:/home/claw
      - ./config/openclaw.json:/home/claw/.openclaw/openclaw.json
    networks:
      - proxy
      - contextforge
      - openclaw
      - tensorzero
    environment:
      TZ: "America/Chicago"
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN is required}"
      TENSORZERO_API_KEY: "${TENSORZERO_API_KEY}"
      CONTEXTFORGE_API_KEY: "${CONTEXTFORGE_API_KEY}"
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--spider"
        - "--tries"
        - "1"
        - "http://localhost:18789/healthz"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      traefik.enable: "true"
      traefik.http.routers.openclaw.rule: "Host(`claw.trkm.io`)"
      traefik.http.services.openclaw.loadBalancer.server.port: "18789"

networks:
  proxy:
    external: true
  contextforge:
    external: true
  openclaw:
    external: true
  tensorzero:
    external: true
