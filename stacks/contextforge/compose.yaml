# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  app:
    container_name: contextforge
    image: ghcr.io/ibm/mcp-context-forge:latest
    restart: unless-stopped
    networks:
      - net
      - proxy
      - contextforge
    environment:
      TZ: "America/Chicago"
      HOST: "0.0.0.0"
      APP_ROOT_PATH: "/mcp"
      APP_DOMAIN: "https://api.trkm.io"
      DATABASE_URL: "postgresql+psycopg://contextforge:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/contextforge"
      REDIS_URL: "redis://cache:6379/0"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      AUTH_ENCRYPTION_SECRET: "${AUTH_ENCRYPTION_SECRET:?AUTH_ENCRYPTION_SECRET is required}"
      PLATFORM_ADMIN_EMAIL: "${PLATFORM_ADMIN_EMAIL:?PLATFORM_ADMIN_EMAIL is required}"
      PLATFORM_ADMIN_PASSWORD: "${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD is required}"
      MCPGATEWAY_UI_ENABLED: "true"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      ENVIRONMENT: "production"
      SSRF_ALLOW_PRIVATE_NETWORKS: "true"
      CACHE_TYPE: "redis"
      DB_POOL_SIZE: "50"
      MCP_SESSION_POOL_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4444/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.contextforge.rule: "Host(`api.trkm.io`) && PathPrefix(`/mcp`)"
      traefik.http.services.contextforge.loadBalancer.server.port: "4444"

  db:
    container_name: contextforge_db
    image: postgres:18
    restart: unless-stopped
    volumes:
      - /mnt/cache/dbdata/postgres/contextforge/data:/var/lib/postgresql
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      POSTGRES_DB: "contextforge"
      POSTGRES_USER: "contextforge"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "contextforge", "-d", "contextforge"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

  cache:
    container_name: contextforge_cache
    image: docker.io/valkey/valkey:9
    restart: unless-stopped
    volumes:
      - /mnt/cache/appdata/contextforge/cache/data:/data
    networks:
      - net
    environment:
      TZ: "America/Chicago"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  net:
  proxy:
    external: true
  contextforge:
    external: true
