# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  app:
    container_name: gitea
    image: gitea/gitea:latest
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - /mnt/cache/appdata/gitea/app/config:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      GITEA__database__DB_TYPE: "postgres"
      GITEA__database__HOST: "db:5432"
      GITEA__database__NAME: "gitea"
      GITEA__database__USER: "gitea"
      GITEA__database__PASSWD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      GITEA__server__DOMAIN: "tea.trkm.io"
      GITEA__server__ROOT_URL: "https://tea.trkm.io/"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.gitea.rule: "Host(`tea.trkm.io`)"
      traefik.http.services.gitea.loadBalancer.server.port: "3000"
      traefik.http.middlewares.gitea-redirect.redirectscheme.scheme: "https"
      traefik.http.routers.gitea-insecure.rule: "Host(`tea.trkm.io`)"
      traefik.http.routers.gitea-insecure.middlewares: "gitea-redirect"
      traefik.http.routers.gitea-insecure.entrypoints: "web"

  db:
    container_name: gitea_db
    image: postgres:18
    restart: unless-stopped
    volumes:
      - /mnt/cache/dbdata/postgres/gitea/data:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      POSTGRES_DB: "gitea"
      POSTGRES_USER: "gitea"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gitea"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  net: