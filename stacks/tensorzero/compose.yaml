# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  gateway:
    container_name: tensorzero
    image: tensorzero/gateway
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
    networks:
      - net
      - proxy
    environment:
      TZ: "America/Chicago"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENCODE_API_KEY: "${OPENCODE_API_KEY}"
      OPENCODE_GO_API_BASE: "${OPENCODE_GO_API_BASE}"
      TENSORZERO_POSTGRES_URL: "postgresql://tensorzero:${POSTGRES_PASSWORD}@postgres:5432/tensorzero"
      TENSORZERO_CLICKHOUSE_URL: "http://tensorzero:${CLICKHOUSE_PASSWORD}@clickhouse:8123/tensorzero"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--spider"
        - "--tries"
        - "1"
        - "http://localhost:3000/status"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["--config-file", "/app/config/**/*.toml"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.tensorzero.rule: "Host(`api.trkm.io`) && PathPrefix(`/t0`)"
      traefik.http.services.tensorzero.loadBalancer.server.port: "3000"

  ui:
    container_name: tensorzero_ui
    image: tensorzero/ui
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
    networks:
      - net
      - proxy
    environment:
      TZ: "America/Chicago"
      TENSORZERO_API_KEY: "${TENSORZERO_API_KEY}"
      TENSORZERO_GATEWAY_URL: "http://gateway:3000"
      TENSORZERO_POSTGRES_URL: "postgresql://tensorzero:${POSTGRES_PASSWORD}@postgres:5432/tensorzero"
    depends_on:
      gateway:
        condition: service_started
    labels:
      traefik.enable: "true"
      traefik.http.routers.tensorzero-ui.rule: "Host(`t0.trkm.io`)"
      traefik.http.services.tensorzero-ui.loadBalancer.server.port: "4000"

  postgres:
    container_name: tensorzero_postgres
    image: tensorzero/postgres:18
    restart: unless-stopped
    volumes:
      - /mnt/cache/dbdata/postgres/tensorzero/data:/var/lib/postgresql
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      POSTGRES_DB: "tensorzero"
      POSTGRES_USER: "tensorzero"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tensorzero", "-d", "tensorzero"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

  clickhouse:
    container_name: tensorzero_clickhouse
    image: clickhouse:lts
    restart: unless-stopped
    volumes:
      - /mnt/cache/dbdata/clickhouse/tensorzero/data:/var/lib/clickhouse
      - /mnt/cache/dbdata/clickhouse/tensorzero/log:/var/log/clickhouse-server
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      CLICKHOUSE_DB: "tensorzero"
      CLICKHOUSE_USER: "tensorzero"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--spider"
        - "--tries"
        - "1"
        - "http://tensorzero:${CLICKHOUSE_PASSWORD}@localhost:8123/ping"
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 30s
      start_interval: 1s

networks:
  net:
  proxy:
    external: true
