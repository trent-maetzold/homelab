# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  server:
    container_name: woodpecker
    image: woodpeckerci/woodpecker-server:v3
    restart: unless-stopped
    volumes:
      - /mnt/cache/appdata/woodpecker/server/data:/var/lib/woodpecker
    networks:
      - net
      - proxy
    environment:
      TZ: "America/Chicago"
      WOODPECKER_HOST: "https://ci.trkm.io"
      WOODPECKER_ADMIN: "trent-maetzold"
      WOODPECKER_DATABASE_DRIVER: "postgres"
      WOODPECKER_DATABASE_DATASOURCE: "postgres://woodpecker:${POSTGRES_PASSWORD}@db:5432/woodpecker"
      WOODPECKER_AGENT_SECRET: "${WOODPECKER_AGENT_SECRET}"
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT: "${WOODPECKER_GITHUB_CLIENT:?WOODPECKER_GITHUB_CLIENT is required}"
      WOODPECKER_GITHUB_SECRET: "${WOODPECKER_GITHUB_SECRET:?WOODPECKER_GITHUB_SECRET is required}"
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: "https://tea.trkm.io"
      WOODPECKER_GITEA_CLIENT: "${WOODPECKER_GITEA_CLIENT:?WOODPECKER_GITEA_CLIENT is required}"
      WOODPECKER_GITEA_SECRET: "${WOODPECKER_GITEA_SECRET:?WOODPECKER_GITEA_SECRET is required}"
      WOODPECKER_ESCALATE: "earthly/earthly"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.routers.woodpecker.rule: "Host(`ci.trkm.io`)"
      traefik.http.services.woodpecker.loadBalancer.server.port: "8000"

  agent:
    container_name: woodpecker_agent
    image: woodpeckerci/woodpecker-agent:v3
    restart: unless-stopped
    volumes:
      - /mnt/cache/appdata/woodpecker/shared/certs/client:/certs/client:ro
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      WOODPECKER_SERVER: "server:9000"
      WOODPECKER_AGENT_SECRET: "${WOODPECKER_AGENT_SECRET:?WOODPECKER_AGENT_SECRET is required}"
      WOODPECKER_MAX_WORKFLOWS: "4"
      WOODPECKER_BACKEND: "docker"
      DOCKER_HOST: "tcp://dind:2376"
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: "/certs/client"
      WOODPECKER_ENVIRON: "EARTHLY_BUILDKIT_HOST=tcp://buildkit:1234"
    depends_on:
      - server
      - dind

  dind:
    container_name: woodpecker_dind
    hostname: dind
    image: docker:dind
    restart: unless-stopped
    privileged: true
    volumes:
      - /mnt/cache/appdata/woodpecker/shared/certs:/certs
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      DOCKER_TLS_CERTDIR: "/certs"

  buildkit:
    container_name: woodpecker_buildkit
    image: moby/buildkit:latest
    restart: unless-stopped
    privileged: true
    volumes:
      - /mnt/cache/appdata/woodpecker/buildkit/data:/var/lib/buildkit
    networks:
      - net
    environment:
      TZ: "America/Chicago"
    command: ["--addr", "tcp://0.0.0.0:1234"]

  db:
    container_name: woodpecker_db
    image: postgres:18
    restart: unless-stopped
    volumes:
      - /mnt/cache/dbdata/postgres/woodpecker/data:/var/lib/postgresql
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      POSTGRES_DB: "woodpecker"
      POSTGRES_USER: "woodpecker"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "woodpecker"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  net:
  proxy:
    external: true
