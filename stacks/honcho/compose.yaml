# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  api:
    container_name: honcho
    image: honcho:local
    restart: unless-stopped
    volumes:
      - ./config/config.toml:/app/config.toml:ro
    networks:
      - net
      - honcho
    environment:
      TZ: "America/Chicago"
      DB_CONNECTION_URI: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/postgres"
      CACHE_URL: "redis://cache:6379/0?suppress=true"
      LLM_OPENAI_API_KEY: "${OPENROUTER_API_KEY}"
      CACHE_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    entrypoint: ["sh", "docker/entrypoint.sh"]

  deriver:
    container_name: honcho_deriver
    image: honcho:local
    restart: unless-stopped
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      DB_CONNECTION_URI: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/postgres"
      CACHE_URL: "redis://cache:6379/0?suppress=true"
      LLM_OPENAI_API_KEY: "${OPENROUTER_API_KEY}"
      CACHE_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]

  db:
    container_name: honcho_db
    image: tensorchord/vchord-suite:pg18-latest
    restart: unless-stopped
    volumes:
      - /mnt/cache/dbdata/postgres/honcho/data:/var/lib/postgresql/data
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      POSTGRES_DB: "honcho"
      POSTGRES_USER: "honcho"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  cache:
    container_name: honcho_cache
    image: docker.io/valkey/valkey:9
    restart: unless-stopped
    networks:
      - net
    environment:
      TZ: "America/Chicago"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  net:
  honcho:
    external: true
