# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  suite:
    container_name: hermes
    image: ascensionoid/hermes-suite:latest
    restart: unless-stopped
    volumes:
      - /mnt/cache/appdata/hermes/suite/data:/opt/data
    networks:
      - proxy
    environment:
      TZ: "America/Chicago"
      OPENCODE_API_KEY: "${OPENCODE_API_KEY}"
      OPENCODE_GO_API_KEY: "${OPENCODE_API_KEY}"
      TRKM_GATEWAY_API_KEY: ${TRKM_GATEWAY_API_KEY:?TRKM_GATEWAY_API_KEY is required}
      SEARXNG_URL: "https://searxng.trkm.io"
    labels:
      traefik.enable: "true"
      # Gateway
      traefik.http.routers.hermes-gateway.rule: "Host(`api.trkm.io`) && PathPrefix(`/hermes`)"
      traefik.http.routers.hermes-gateway.service: "hermes-gateway"
      traefik.http.routers.hermes-gateway.middlewares: "hermes-gateway-stripprefix"
      traefik.http.middlewares.hermes-gateway-stripprefix.stripprefix.prefixes: "/hermes"
      traefik.http.services.hermes-gateway.loadBalancer.server.port: "8642"
      # Web UI
      traefik.http.routers.hermes-webui.rule: "Host(`hermes.trkm.io`)"
      traefik.http.routers.hermes-webui.service: "hermes-webui"
      traefik.http.services.hermes-webui.loadBalancer.server.port: "8787"
      # Dashboard
      traefik.http.routers.hermes-dashboard.rule: "Host(`hermes.trkm.io`) && PathPrefix(`/dashboard`)"
      traefik.http.routers.hermes-dashboard.service: "hermes-dashboard"
      traefik.http.routers.hermes-dashboard.middlewares: "hermes-dashboard-stripprefix"
      traefik.http.middlewares.hermes-dashboard-stripprefix.stripprefix.prefixes: "/dashboard"
      traefik.http.services.hermes-dashboard.loadBalancer.server.port: "9119"

networks:
  proxy:
    external: true
