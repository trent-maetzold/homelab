# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  gateway:
    container_name: bifrost
    image: maximhq/bifrost
    restart: unless-stopped
    volumes:
      - ./config/gateway/config.json:/app/data/config.json:ro
      - /mnt/cache/appdata/bifrost/gateway/data:/app/data
    networks:
      - net
      - proxy
    environment:
      TZ: "America/Chicago"
      OPENCODE_GO_API_KEY: "${OPENCODE_GO_API_KEY:?OPENCODE_GO_API_KEY is required}"
      BIFROST_ENCRYPTION_KEY: "${BIFROST_ENCRYPTION_KEY:?BIFROST_ENCRYPTION_KEY is required}"
      PG_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      traefik.enable: "true"
      traefik.http.routers.bifrost.rule: "Host(`bifrost.trkm.io`)"
      traefik.http.services.bifrost.loadBalancer.server.port: "8080"

  db:
    container_name: bifrost_db
    image: postgres:18
    restart: unless-stopped
    volumes:
      - /mnt/cache/dbdata/postgres/bifrost/data:/var/lib/postgresql
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      POSTGRES_DB: "bifrost"
      POSTGRES_USER: "bifrost"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bifrost", "-d", "bifrost"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

  opencode-go:
    container_name: bifrost_opencode_go
    image: ghcr.io/chopratejas/headroom:latest
    restart: unless-stopped
    volumes:
      - /mnt/cache/appdata/bifrost/opencode-go/data:/data
    networks:
      - net
      - proxy
    environment:
      TZ: "America/Chicago"
      HOME: "/data"
      OPENAI_TARGET_API_URL: "https://opencode.ai/zen/go"
      ANTHROPIC_TARGET_API_URL: "https://opencode.ai/zen/go"
      GEMINI_TARGET_API_URL: "https://opencode.ai/zen/go"
      HEADROOM_TELEMETRY: "off"
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.bifrost-opencode-go-strip.stripPrefix.prefixes: "/opencode-go"
      traefik.http.routers.bifrost-opencode-go.rule: "Host(`bifrost.trkm.io`) && PathPrefix(`/opencode-go/dashboard`)"
      traefik.http.routers.bifrost-opencode-go.middlewares: "bifrost-opencode-go-strip"
      traefik.http.services.bifrost-opencode-go.loadBalancer.server.port: "8787"

  ext-model-params:
    container_name: bifrost_model_params
    build:
      context: ./extensions/model-params
    pull_policy: build
    restart: unless-stopped
    networks:
      - net
    environment:
      TZ: "America/Chicago"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  net:
  proxy:
    external: true
