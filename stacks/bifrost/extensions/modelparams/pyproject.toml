[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelparams"]

[project]
name = "modelparams"
version = "0.1.0"
description = "Bifrost sidecar: translates model metadata from models.dev into Bifrost's datasheet format"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.139.0",
  "granian>=2.7.9",
  "httpx2>=2.5.0",
  "pydantic>=2.13.4",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-mock>=3.15.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that verify endpoint registration and routing against the app's OpenAPI schema",
]
addopts = "-m 'not integration'"
filterwarnings = ["ignore::DeprecationWarning"]
