# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  proxy:
    container_name: traefik
    hostname: proxy
    image: traefik:v3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/dynamic:/etc/traefik/dynamic
      - /mnt/cache/appdata/traefik/proxy/letsencrypt:/letsencrypt
      - /mnt/cache/appdata/traefik/proxy/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      br0:
        ipv4_address: 10.10.20.10
      headscale:
      proxy:
    environment:
      TZ: "America/Chicago"
      CF_API_EMAIL: "tkm89@proton.me"
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN:?CF_DNS_API_TOKEN is required}"
      CF_ZONE_API_TOKEN: "${CF_ZONE_API_TOKEN:?CF_ZONE_API_TOKEN is required}"
    command:
      - "--api.dashboard=true"
      - "--api.disabledashboardad=true"
      - "--log.level=INFO"
      - "--log.filepath=/var/log/traefik.log"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik-access.log"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--providers.docker.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.asdefault=true"
      - "--entrypoints.websecure.http.middlewares=auth@file"
      - "--entrypoints.websecure.http.tls.certresolver=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.email=tkm89@proton.me"
      - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--serverstransport.insecureskipverify=true"
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "Host(`traefik.trkm.io`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      traefik.http.routers.api.service: "api@internal"
      traefik.http.services.api.loadBalancer.server.port: "1"

  vpn:
    container_name: traefik_ts
    image: ghcr.io/tailscale/tailscale:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - /mnt/cache/appdata/traefik/vpn/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    network_mode: service:proxy
    environment:
      TZ: "America/Chicago"
      TS_AUTH_ONCE: "true"
      TS_AUTHKEY: "${TS_AUTHKEY:?TS_AUTHKEY is required}"
      TS_USERSPACE: "false"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_EXTRA_ARGS: "--login-server=http://headscale:8080"
    depends_on:
      - proxy

networks:
  br0:
    external: true
  headscale:
    external: true
  proxy:
    external: true
