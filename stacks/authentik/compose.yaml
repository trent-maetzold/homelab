# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

x-authentik-env: &authentik-env
  AUTHENTIK_EMAIL__FROM: "admin@trkm.io"
  AUTHENTIK_EMAIL__HOST: "smtp.protonmail.ch"
  AUTHENTIK_EMAIL__PORT: "587"
  AUTHENTIK_EMAIL__USERNAME: "admin@trkm.io"
  AUTHENTIK_EMAIL__PASSWORD: "${PROTONMAIL_SMTP_TOKEN:?PROTONMAIL_SMTP_TOKEN is required}"
  AUTHENTIK_EMAIL__USE_TLS: "true"
  AUTHENTIK_EMAIL__USE_SSL: "false"
  AUTHENTIK_EMAIL__TIMEOUT: "10"
  AUTHENTIK_POSTGRESQL__HOST: "db"
  AUTHENTIK_POSTGRESQL__NAME: "authentik"
  AUTHENTIK_POSTGRESQL__USER: "authentik"
  AUTHENTIK_POSTGRESQL__PASSWORD: "${POSTGRES_PASSWORD}"
  AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}"

services:
  server:
    container_name: authentik
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:?AUTHENTIK_VERSION is
      required}
    restart: unless-stopped
    volumes:
      - /mnt/cache/appdata/authentik/shared/data:/data
      - /mnt/cache/appdata/authentik/shared/templates:/templates
    networks:
      - net
      - proxy
    environment:
      TZ: "America/Chicago"
      <<: *authentik-env
    depends_on:
      db:
        condition: service_healthy
    command: ["server"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.authentik.rule: "Host(`auth.trkm.io`)"
      traefik.http.services.authentik.loadBalancer.server.port: "9000"

  worker:
    container_name: authentik_worker
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    restart: unless-stopped
    user: "root"
    volumes:
      - /mnt/cache/appdata/authentik/shared/data:/data
      - /mnt/cache/appdata/authentik/shared/templates:/templates
      - /mnt/cache/appdata/authentik/worker/certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      <<: *authentik-env
    depends_on:
      db:
        condition: service_healthy
    command: ["worker"]

  db:
    container_name: authentik_db
    image: postgres:18
    restart: unless-stopped
    volumes:
      - /mnt/cache/dbdata/postgres/authentik/data:/var/lib/postgresql
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      POSTGRES_DB: "authentik"
      POSTGRES_USER: "authentik"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "authentik", "-d", "authentik"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

networks:
  net:
  proxy:
    external: true
