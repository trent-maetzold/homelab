# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  app:
    container_name: authelia
    image: ghcr.io/authelia/authelia:latest
    restart: unless-stopped
    volumes:
      - ./config:/config
    networks:
      - net
      - proxy
    environment:
      TZ: "America/Chicago"
      X_AUTHELIA_CONFIG: "/config/configuration.yaml"
      AUTHELIA_AUTHENTICATION_BACKEND_FILE_PATH: "/config/users_database.yaml"
      AUTHELIA_NOTIFIER_SMTP_SENDER: "admin@trkm.io"
      AUTHELIA_NOTIFIER_SMTP_ADDRESS: "smtp.protonmail.ch:587"
      AUTHELIA_NOTIFIER_SMTP_USERNAME: "admin@trkm.io"
      AUTHELIA_NOTIFIER_SMTP_PASSWORD: "${PROTONMAIL_SMTP_TOKEN:?PROTONMAIL_SMTP_TOKEN is required}"
      AUTHELIA_STORAGE_POSTGRES_ADDRESS: "tcp://db:5432"
      AUTHELIA_STORAGE_POSTGRES_DATABASE: "authelia"
      AUTHELIA_STORAGE_POSTGRES_USERNAME: "authelia"
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      AUTHELIA_STORAGE_ENCRYPTION_KEY: "${AUTHELIA_STORAGE_ENCRYPTION_KEY:?AUTHELIA_STORAGE_ENCRYPTION_KEY is required}"
      AUTHELIA_SESSION_REDIS_HOST: "cache"
      AUTHELIA_SESSION_SECRET: "${AUTHELIA_SESSION_SECRET:?AUTHELIA_SESSION_SECRET is required}"
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "${AUTHELIA_JWT_SECRET:?AUTHELIA_JWT_SECRET is required}"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      traefik.enable: "true"
      traefik.http.routers.authelia.rule: "Host(`auth.trkm.io`)"
      traefik.http.services.authelia.loadBalancer.server.port: "9091"

  cache:
    container_name: authelia_cache
    image: docker.io/valkey/valkey:latest
    restart: unless-stopped
    networks:
      - net
    environment:
      TZ: "America/Chicago"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  db:
    container_name: authelia_db
    image: postgres:18
    restart: unless-stopped
    volumes:
      - /mnt/cache/dbdata/postgres/authelia/data:/var/lib/postgresql
    networks:
      - net
    environment:
      TZ: "America/Chicago"
      POSTGRES_DB: "authelia"
      POSTGRES_USER: "authelia"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "authelia", "-d", "authelia"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

networks:
  net:
  proxy:
    external: true
