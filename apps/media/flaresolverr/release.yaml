apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: media
spec:
  interval: 1h
  releaseName: flaresolverr
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      app:
        containers:
          app:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: latest
            env:
              TZ: America/Chicago
              LOG_LEVEL: info
    service:
      app:
        controller: app
        ports:
          http:
            port: 8191
