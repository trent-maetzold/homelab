apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr-hd
  namespace: media
spec:
  interval: 1h
  releaseName: radarr-hd
  chartRef:
    kind: OCIRepository
    name: app-template
  valuesFrom:
    - kind: ConfigMap
      name: radarr-values
  values:
    controllers:
      app:
        containers:
          app:
            env:
              RADARR__APP__INSTANCENAME: Radarr HD
              RADARR__SERVER__URLBASE: /hd
              RADARR__POSTGRES__MAINDB: radarr_hd
              RADARR__POSTGRES__LOGDB: radarr_hd_log
---
