apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  interval: 1h
  releaseName: seerr
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      app:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: latest
            env:
              TZ: America/Chicago
              DB_TYPE: postgres
              DB_HOST: seerr-postgres-rw
              DB_PORT: "5432"
              DB_NAME: seerr
              DB_USER: seerr
              DB_PASS:
                valueFrom:
                  secretKeyRef:
                    name: seerr
                    key: postgres-password
    service:
      app:
        controller: app
        ports:
          http:
            port: 5055
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        globalMounts:
          - path: /app/config
