apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr-hd
  namespace: media
spec:
  interval: 1h
  releaseName: sonarr-hd
  chartRef:
    kind: OCIRepository
    name: app-template
  valuesFrom:
    - kind: ConfigMap
      name: sonarr-values
  values:
    controllers:
      app:
        containers:
          app:
            env:
              SONARR__APP__INSTANCENAME: Sonarr HD
              SONARR__SERVER__URLBASE: /hd
              SONARR__POSTGRES__MAINDB: sonarr_hd
              SONARR__POSTGRES__LOGDB: sonarr_hd_log
---
