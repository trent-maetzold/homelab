apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidarr
  namespace: media
spec:
  interval: 1h
  releaseName: lidarr
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      app:
        strategy: Recreate
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/lidarr
              tag: latest
            env:
              TZ: America/Chicago
              PUID: "99"
              PGID: "100"
              UMASK: "022"
              LIDARR__APP__INSTANCENAME: Lidarr
              LIDARR__AUTH__METHOD: Forms
              LIDARR__UPDATE__MECHANISM: Docker
              LIDARR__POSTGRES__HOST: arr-postgres-rw
              LIDARR__POSTGRES__USER: lidarr
              LIDARR__POSTGRES__MAINDB: lidarr
              LIDARR__POSTGRES__LOGDB: lidarr_log
              LIDARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: lidarr
                    key: api-key
              LIDARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: lidarr
                    key: postgres-password
    service:
      app:
        controller: app
        ports:
          http:
            port: 8686
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 5Gi
        retain: true
        globalMounts:
          - path: /config
      media:
        type: persistentVolumeClaim
        existingClaim: nas-data
        globalMounts:
          - path: /data
