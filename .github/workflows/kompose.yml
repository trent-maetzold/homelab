name: Preview media manifests

on:
  pull_request:
    paths:
      - 'compose/media/**'
      - '.github/workflows/kompose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack: [flaresolverr, lidarr, prowlarr, qbittorrent, radarr, sabnzbd, seerr, sonarr]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bake Compose input (preview only)
        id: bake
        uses: Azure/k8s-bake@bf8bfd33b007edea820fe80983239bca24012239 # v4.1.1
        with:
          renderEngine: kompose
          kompose-version: v1.38.0
          dockerComposeFile: compose/media/${{ matrix.stack }}/compose.yaml
        env:
          ARR_API_KEY: preview-only
          POSTGRES_PASSWORD: preview-only
          WIREGUARD_PRIVATE_KEY: preview-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kompose-preview-${{ matrix.stack }}-not-for-deployment
          path: ${{ steps.bake.outputs.manifestsBundle }}
          if-no-files-found: error
